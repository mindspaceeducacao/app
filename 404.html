<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<script>
  /* ============================================================
     CONFIGURAÇÃO — ajuste se o nome do repositório mudar
     ============================================================ */
  var SITE_BASE = "/app";                 // raiz do site no GitHub Pages
  var VIEWER_BASE = SITE_BASE + "/viewer"; // pasta com o visualizador compartilhado

  (function () {
    // Descobre o "slug" do PDF a partir da URL limpa
    // Ex: /app/aluno/1ano/estante-de-conteudos/Livro-Portugues
    var path = window.location.pathname.replace(/\/$/, "");
    var parts = path.split("/").filter(Boolean);
    var rawSlug = parts.pop() || "";
    var baseDir = "/" + parts.join("/");
    var decodedName = decodeURIComponent(rawSlug);

    // URL usada para BUSCAR o arquivo: sempre corretamente codificada
    // (resolve o problema de espaços/acentos não sendo encontrados).
    window.__PDF_OVERRIDE_URL__ = baseDir + "/" + encodeURIComponent(decodedName) + ".pdf";
    // Nome usado para EXIBIR (título da aba, nome do documento): sem codificação.
    window.__PDF_OVERRIDE_NAME__ = decodedName + ".pdf";

    // Faz todos os caminhos relativos (css/js/pdfjs) apontarem para a
    // pasta do visualizador compartilhado, não para a URL "falsa" atual.
    document.write('<base href="' + VIEWER_BASE + '/">');
  })();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>PDF Viewer</title>
<meta name="description" content="Visualizador de PDF moderno, rápido e responsivo." />
<link rel="icon" type="image/svg+xml" href="assets/logo.svg" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body data-theme="light">

    <path d="M9.75 3H5.75C5.05222 3 4.70333 3 4.41943 3.08612C3.78023 3.28002 3.28002 3.78023 3.08612 4.41943C3 4.70333 3 5.05222 3 5.75C3 6.44778 3 6.79667 3.08612 7.08057C3.28002 7.71977 3.78023 8.21998 4.41943 8.41388C4.70333 8.5 5.05222 8.5 5.75 8.5H9.75C10.4478 8.5 10.7967 8.5 11.0806 8.41388C11.7198 8.21998 12.22 7.71977 12.4139 7.08057C12.5 6.79667 12.5 6.44778 12.5 5.75C12.5 5.05222 12.5 4.70333 12.4139 4.41943C12.22 3.78023 11.7198 3.28002 11.0806 3.08612C10.7967 3 10.4478 3 9.75 3Z"></path>

    <!-- ===================== SEARCH PANEL ===================== -->
    <div class="search-panel" id="searchPanel" role="search" aria-hidden="true">
      <span class="search-panel__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M11 19C15.4183 19 19 15.4183 19 11C19 6.58172 15.4183 3 11 3C6.58172 3 3 6.58172 3 11C3 15.4183 6.58172 19 11 19Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M21 21L17 17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <input type="text" id="searchInput" class="search-panel__input" placeholder="Pesquisar no documento..." autocomplete="off" />
      <span class="search-panel__count" id="searchCount">0 / 0</span>

      <button class="icon-btn icon-btn--sm" id="btnSearchPrev" title="Ocorrência anterior" aria-label="Ocorrência anterior">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M18 15L12 9L6 15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="icon-btn icon-btn--sm" id="btnSearchNext" title="Próxima ocorrência" aria-label="Próxima ocorrência">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 9L12 15L18 9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="icon-btn icon-btn--sm" id="btnSearchClose" title="Fechar pesquisa" aria-label="Fechar pesquisa">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M18 6L6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 6L18 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>

    <!-- ========================== BODY ========================== -->
    <div class="app-body">

      <!-- ------------------ SIDEBAR (Miniaturas) ------------------ -->
      <aside class="sidebar" id="sidebar" aria-label="Miniaturas das páginas">
        <div class="sidebar__header">
          <span>Páginas</span>
          <span class="sidebar__count" id="sidebarPageCount">0</span>
        </div>
        <div class="sidebar__list" id="thumbnailList">
          <!-- Miniaturas inseridas dinamicamente via thumbnails.js -->
        </div>
      </aside>

      <!-- Handle para colapsar/expandir em telas pequenas -->
      <div class="sidebar-resizer" id="sidebarResizer" aria-hidden="true"></div>

      <!-- ------------------ VIEWER (Área principal) ------------------ -->
      <main class="viewer" id="viewerContainer" tabindex="0" aria-label="Área de visualização do PDF">
        <div class="viewer__pages" id="pagesContainer">
          <!-- Páginas (canvas) inseridas dinamicamente via viewer.js -->
        </div>

        <!-- Indicador flutuante de página atual durante rolagem -->
        <div class="page-indicator" id="pageIndicator">1 / 0</div>

        <!-- Botão flutuante "voltar ao topo" -->
        <button class="scroll-top-btn" id="btnScrollTop" title="Voltar ao topo" aria-label="Voltar ao topo">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 19V5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M6 11L12 5L18 11" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </main>
    </div>

    <!-- ===================== LOADING OVERLAY ===================== -->
    <div class="loading-overlay" id="loadingOverlay">
      <div class="loading-overlay__content">
        <div class="loading-spinner"></div>
        <p class="loading-overlay__text" id="loadingText">Carregando documento...</p>
        <div class="loading-progress">
          <div class="loading-progress__bar" id="loadingProgressBar"></div>
        </div>
      </div>
    </div>

    <!-- ===================== TOAST NOTIFICATIONS ===================== -->
    <div class="toast-container" id="toastContainer" aria-live="polite"></div>

  </div>

  <!-- ============================================================ -->
  <!-- SCRIPTS                                                       -->
  <!-- ============================================================ -->
  <script src="pdfjs/pdf.min.js"></script>
  <script src="js/toolbar.js" defer></script>
  <script src="js/thumbnails.js" defer></script>
  <script src="js/search.js" defer></script>
  <script src="js/viewer.js" defer></script>
</body>
</html>
